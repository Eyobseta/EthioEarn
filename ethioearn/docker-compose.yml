services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: ethioearn, POSTGRES_PASSWORD: ethioearn, POSTGRES_DB: ethioearn }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U ethioearn"], interval: 5s, retries: 10 }
  api:
    build: .
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment: { DATABASE_URL: "postgres://ethioearn:ethioearn@db:5432/ethioearn" }
    ports: ["3000:3000"]
volumes: { pgdata: {} }
